<html>

<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Dashboard VR</title>
    <link rel="shortcut icon" href="vr-glasses.ico" type="image/x-icon">
</head>

<body>

    <div class="text-top">
        Dashboard Obra
    </div>

    <div class="text-bottom">
        Mantenhe o Marcador na Área de Leitura
    </div>

    <!-- DASHBOARD -->
    <iframe id="dashboard" src="https://www.ailtonbarreto.com.br/projects/bim5d.html"
        style="visibility: hidden;"></iframe>

    <div id="scan-area">

        <div style="position:absolute; top:0; left:0; width:100%; height:21%; background:white;"></div>
        <div style="position:absolute; bottom:0; left:0; width:100%; height:40%; background: white;"></div>
        <div style="position:absolute; top:20%; left:0; width:12%; height:40%; background:white;"></div>
        <div style="position:absolute; top:20%; right:0; width:12%; height:40%; background:white;"></div>

        <div id="window"></div>

    </div>


    <!-- CENA AR -->
    <a-scene embedded arjs="sourceType: webcam;" vr-mode-ui="enabled: false">

        <a-marker id="hiroMarker" type="pattern" url="dashmarker.patt" smooth="true" smoothCount="10"
            smoothTolerance="0.01" smoothThreshold="5">
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const marker = document.getElementById("hiroMarker");
        const dash = document.getElementById("dashboard");

        marker.addEventListener("markerFound", () => {
            dash.style.display = "block";
            dash.style.visibility = "visible";
        });

        marker.addEventListener("markerLost", () => {
            dash.style.display = "none";
        });
    </script>

</body>

</html>
