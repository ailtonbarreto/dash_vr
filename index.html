<html>

<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

    <!-- DASHBOARD -->
    <iframe id="dashboard"
        title="Dashboard Comercial"
        src="https://www.ailtonbarreto.com.br/projects/bim5d.html"
        frameborder="0"
        allowFullScreen="true"
        style="
            display:block;
            visibility:hidden;
            position:fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            z-index:9999;
            background:rgb(1, 40, 99);
            opacity: 0.8;
        ">
    </iframe>

    <!-- ÁREA DE SCAN -->
    <div id="scan-area" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 9998;
    ">

        <!-- MÁSCARAS PRETAS AO REDOR DA JANELA -->
        <div style="position:absolute; top:0; left:0; width:100%; height:21%; background:black;"></div>
        <div style="position:absolute; bottom:0; left:0; width:100%; height:40%; background:black;"></div>
        <div style="position:absolute; top:20vh; left:0; width:12%; height:40%; background:black;"></div>
        <div style="position:absolute; top:20vh; right:0; width:10%; height:40vh; background:black;"></div>

        <!-- JANELA DE SCAN (TRANSPARENTE) -->
        <div style="
            position: absolute;
            top: 20vh;
            left: 10vw;
            width: 80vw;
            height: 40vh;
            background: transparent;
            border: 4px solid rgba(3, 137, 214, 0.658);
            border-radius: 12px;
        ">

            <!-- TEXTO -->
            <div style="
                position: absolute;
                top: -60px;
                left: 50%;
                width: 100%;
                transform: translateX(-50%);
                color: white;
                font-size: 22px;
                text-align: center;
            ">
                Encaixe o marcador nessa área
            </div>

        </div>
    </div>

    <!-- CENA AR -->
    <a-scene embedded arjs="sourceType: webcam;" vr-mode-ui="enabled: false">

        <a-marker id="hiroMarker" type="pattern" url="dashmarker.patt"
            smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const marker = document.getElementById("hiroMarker");
        const dash = document.getElementById("dashboard");

        marker.addEventListener("markerFound", () => {
            dash.style.display = "block";
            dash.style.visibility = "visible";
        });

        marker.addEventListener("markerLost", () => {
            dash.style.display = "none";
        });
    </script>

</body>

</html>
