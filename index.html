<html>

<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="vr-glasses.ico" type="image/x-icon">
    <title>Dashboard VR</title>
</head>

<body>

    <div id="scan-wrapper">

        <div id="camera-feed"></div>

    </div>

    <iframe id="dashboard"
        src="https://www.ailtonbarreto.com.br/projects/bim5d.html"
        frameborder="0"
        allowFullScreen="true">
    </iframe>

    <!-- CENA AR -->
    <a-scene embedded arjs="sourceType: webcam;" vr-mode-ui="enabled: false" style="z-index:1;">

        <a-marker id="hiroMarker" type="pattern" url="dashmarker.patt"
            smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>

        const observer = new MutationObserver(() => {
            const video = document.querySelector("video");
            if (video) {
                video.style.width = "100%";
                video.style.height = "100%";
                video.style.objectFit = "cover";
                document.getElementById("camera-feed").appendChild(video);
                observer.disconnect();
            }
        });

        observer.observe(document.body, { childList: true, subtree: true });

        const marker = document.getElementById("hiroMarker");
        const dash = document.getElementById("dashboard");

        marker.addEventListener("markerFound", () => {
            dash.style.visibility = "visible";
        });

        marker.addEventListener("markerLost", () => {
            dash.style.visibility = "hidden";
        });
    </script>

</body>

</html>
