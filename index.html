<html>

<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <link rel="shortcut icon" href="vr-glasses.ico" type="image/x-icon">
    <title>Dashboard VR</title>
</head>

<body style="margin: 0; overflow: hidden;">


    <iframe id="card1" src="https://ailtonbarreto.github.io/cracha" frameborder="0" allowFullScreen="true" style="
        display:block;
        visibility:hidden;
        position:fixed;
        border-radius: 1vw;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100vw;
        height: 100vh;
        z-index:9999;
        background:rgb(0, 0, 0);
        opacity: 0.9;
    ">
    </iframe>

    <iframe id="card2" src="https://ailtonbarreto.github.io/cracha/func2" frameborder="0" allowFullScreen="true" style="
        display:block;
        visibility:hidden;
        position:fixed;
        border-radius: 1vw;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100vw;
        height: 100vh;
        z-index:9999;
        background:rgb(0, 0, 0);
        opacity: 0.9;
    ">
    </iframe>


    <a-scene embedded arjs="sourceType: webcam;" vr-mode-ui="enabled: false">

        <!-- MARCADOR 1 -->
        <a-marker id="marker1" type="pattern" url="card1.patt"></a-marker>

        <!-- MARCADOR 2 -->
        <a-marker id="marker2" type="pattern" url="card2.patt"></a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- CARD 1 -->
    <div id="card1" class="card" style="display:none;">
        CARD 1 ATIVADO
    </div>

    <!-- CARD 2 -->
    <div id="card2" class="card" style="display:none;">
        CARD 2 ATIVADO
    </div>


    <script>
        const markers = [
            { id: "marker1", card: "card1" },
            { id: "marker2", card: "card2" }
        ];

        markers.forEach(item => {
            const marker = document.getElementById(item.id);
            const card = document.getElementById(item.card);

            marker.addEventListener("markerFound", () => {
                card.style.display = "block";
                card.style.visibility = "visible";
            });

            marker.addEventListener("markerLost", () => {
                card.style.display = "none";
            });
        });

    </script>

</body>

</html>
